name: On-demand integration checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: bash mvnw test
        working-directory: terra-backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: CI=true npm test -- --watchAll=false
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
        working-directory: computer-vision
      - run: python -m unittest discover -s tests -v
        working-directory: computer-vision

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: terra_test
          POSTGRES_USER: terra_test
          POSTGRES_PASSWORD: test_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U terra_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: >-
          bash mvnw test
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/terra_test
          -Dspring.datasource.username=terra_test
          -Dspring.datasource.password=test_only
          -Dspring.datasource.driver-class-name=org.postgresql.Driver
          -Dspring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
        working-directory: terra-backend
