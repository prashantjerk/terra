spring.application.name=terra-backend

# PostgreSQL Connection (Update password if needed)
spring.datasource.url=jdbc:postgresql://localhost:5432/terra_db
spring.datasource.username=postgres
spring.datasource.password=Samin@21072107
spring.datasource.driver-class-name=org.postgresql.Driver

# Execute schema.sql automatically on application start
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql

# Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true