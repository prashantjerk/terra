spring.application.name=terra-backend

# PostgreSQL Connection (Update password if needed)
spring.datasource.url=jdbc:postgresql://localhost:5432/terra_db
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Execute schema.sql automatically on application start
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql

# Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# On-demand Pi integration. Supply these in the backend process environment.
terra.pi-url=${TERRA_PI_URL:}
terra.pi-token=${TERRA_PI_TOKEN:}
terra.cache-seconds=30
terra.requests-per-minute=5
terra.pi-timeout-seconds=60

# Counts must be integers; do not silently truncate decimal JSON values.
spring.jackson.deserialization.accept-float-as-int=false
